<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">rm-send</title>
  <desc id="desc">Terminal-style cover for rm-send, a clipboard to reMarkable tablet pipeline.</desc>
  <rect width="1200" height="630" fill="#1e1e2e"/>
  <rect x="0.5" y="0.5" width="1199" height="629" rx="16" fill="none" stroke="#45475a"/>

  <path d="M0 16a16 16 0 0 1 16-16h1168a16 16 0 0 1 16 16v48H0z" fill="#181825"/>
  <circle cx="36" cy="32" r="7" fill="#f38ba8"/>
  <circle cx="60" cy="32" r="7" fill="#f9e2af"/>
  <circle cx="84" cy="32" r="7" fill="#a6e3a1"/>
  <text x="112" y="39" fill="#a6adc8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">rm-send — clipboard → reMarkable</text>

  <text x="70" y="184" fill="#89b4fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="86" font-weight="700">rm-send</text>
  <text x="72" y="232" fill="#cdd6f4" font-family="Inter, system-ui, sans-serif" font-size="29">One keystroke from clipboard to paper.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="70" y="300" width="212" height="112" rx="12" fill="#313244"/>
    <text x="176" y="346" fill="#f9e2af" font-size="22" text-anchor="middle">clipboard</text>
    <text x="176" y="378" fill="#a6adc8" font-size="17" text-anchor="middle">text or image</text>

    <text x="308" y="366" fill="#6c7086" font-size="34" text-anchor="middle">→</text>

    <rect x="348" y="300" width="190" height="112" rx="12" fill="#313244"/>
    <text x="443" y="346" fill="#a6e3a1" font-size="22" text-anchor="middle">typst</text>
    <text x="443" y="378" fill="#a6adc8" font-size="17" text-anchor="middle">~0.3 s</text>

    <text x="564" y="366" fill="#6c7086" font-size="34" text-anchor="middle">→</text>

    <rect x="604" y="300" width="190" height="112" rx="12" fill="#313244"/>
    <text x="699" y="346" fill="#cba6f7" font-size="22" text-anchor="middle">PDF</text>
    <text x="699" y="378" fill="#a6adc8" font-size="17" text-anchor="middle">1404 × 1872 pt</text>

    <text x="820" y="366" fill="#6c7086" font-size="34" text-anchor="middle">→</text>

    <rect x="860" y="300" width="270" height="112" rx="12" fill="#313244"/>
    <text x="995" y="346" fill="#f38ba8" font-size="22" text-anchor="middle">reMarkable</text>
    <text x="995" y="378" fill="#a6adc8" font-size="17" text-anchor="middle">cloud or USB</text>
  </g>

  <text x="70" y="480" fill="#a6e3a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">✓ Queued</text>
  <text x="220" y="480" fill="#a6e3a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">✓ Delivered</text>
  <text x="1130" y="480" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" text-anchor="end">zz Inbox · Linux &amp; macOS</text>
</svg>
